# Démo en ligne : landing à la racine, application sous /app/.
# Chaque push sur main redéploie automatiquement.
[build]
  command = "bash tool/netlify_build.sh"
  publish = "dist"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Fichiers de l'app qui changent rarement : pas de vérification à chaque ouverture.
[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/app/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
