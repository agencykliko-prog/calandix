<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Base href remplacée par `flutter build web --base-href` (ex. /app/ sur Netlify).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calandix : prestataires vérifiés, invités et équipe au même endroit. Le budget parfait pour célébrer.">
  <meta name="theme-color" content="#1A0637">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Calandix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calandix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Écran de chargement aux couleurs de Calandix : visible dès le premier
       octet, pendant que le moteur de l'app se télécharge (utile sur une
       connexion mobile lente). -->
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity .4s ease, visibility .4s; }
    #splash.done { opacity: 0; visibility: hidden; }
    /* Le symbole seul (96 px sur téléphone, 112 px au-delà). Les trois
       cartes arrivent l'une après l'autre, puis le symbole respire
       doucement tant que l'app charge. */
    .sp-mark { display: block; width: 96px; height: 96px; overflow: visible; animation: sp-breathe 2.4s ease-in-out .9s infinite; }
    @media (min-width: 600px) { .sp-mark { width: 112px; height: 112px; } }
    .sp-mark rect { transform-box: fill-box; transform-origin: 50% 100%; animation: sp-card .7s cubic-bezier(.34, 1.56, .64, 1) both; }
    .sp-mark .c2 { animation-delay: .12s; }
    .sp-mark .c3 { animation-delay: .24s; }
    .sp-mark .tilt { transform-box: fill-box; transform-origin: 30% 70%; animation: sp-tilt 2.4s ease-in-out .9s infinite; }
    @keyframes sp-card { from { opacity: 0; transform: translateY(28%) scale(.86); } to { opacity: 1; transform: none; } }
    @keyframes sp-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes sp-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) {
      .sp-mark, .sp-mark .tilt { animation: none; }
      .sp-mark rect { animation: none; }
    }
  </style>
</head>
<body>
  <noscript><p style="position:fixed;inset:auto 0 24px;z-index:10000;color:#1A0637;text-align:center;font-family:system-ui,sans-serif">Calandix a besoin de JavaScript pour fonctionner.</p></noscript>
  <div id="splash" role="status" aria-label="Chargement de Calandix">
    <svg class="sp-mark" viewBox="62.43 35.58 136 136" aria-hidden="true">
      <rect class="c1" x="71.178" y="41.676" width="118.506" height="72.284" rx="22.016" fill="#e59d1f"/>
      <rect class="c2" x="71.178" y="64.396" width="118.506" height="72.284" rx="22.016" fill="#e01928"/>
      <g transform="translate(23.862 -21.748) rotate(10.486)"><g class="tilt"><rect class="c3" x="71.178" y="83.002" width="118.506" height="72.284" rx="22.016" fill="#4d39e2"/></g></g>
    </svg>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
