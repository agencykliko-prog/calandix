<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Base href remplacée par `flutter build web --base-href` (ex. /app/ sur Netlify).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calandix : prestataires vérifiés, invités et équipe au même endroit. Le budget parfait pour célébrer.">
  <meta name="theme-color" content="#1A0637">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Calandix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calandix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Écran de chargement aux couleurs de Calandix : visible dès le premier
       octet, pendant que le moteur de l'app se télécharge (utile sur une
       connexion mobile lente). -->
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity .4s ease, visibility .4s; }
    #splash.done { opacity: 0; visibility: hidden; }
    .sp-box { display: grid; justify-items: center; gap: 26px; }
    .sp-logo { display: block; width: 190px; height: auto; }
    .sp-line { position: relative; width: 132px; height: 3px; border-radius: 3px; background: #EEEBF6; overflow: hidden; }
    .sp-line i { position: absolute; inset: 0; border-radius: 3px; transform-origin: left; background: linear-gradient(90deg, #E59D1F, #E01928, #4D39E2); animation: sp-sweep 1.5s cubic-bezier(.65, 0, .35, 1) infinite; }
    @keyframes sp-sweep { 0% { transform: translateX(-100%); } 55%, 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .sp-line i { animation: none; } }
  </style>
</head>
<body>
  <noscript><p style="position:fixed;inset:auto 0 24px;z-index:10000;color:#1A0637;text-align:center;font-family:system-ui,sans-serif">Calandix a besoin de JavaScript pour fonctionner.</p></noscript>
  <div id="splash" role="status" aria-label="Chargement de Calandix">
    <div class="sp-box">
      <img class="sp-logo" src="brand/calandix-logo.svg" width="760" height="124" alt="">
      <div class="sp-line" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
